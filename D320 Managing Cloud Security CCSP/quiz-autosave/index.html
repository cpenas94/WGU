<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D320 Quiz — Autosave</title><style>:root{font-family:system-ui,Segoe UI,Arial;background:#0e1726;color:#e9f0fb}body{max-width:860px;margin:25px auto;padding:0 18px}h1{font-size:26px}.panel{background:#18263a;border:1px solid #334760;border-radius:14px;padding:22px;margin:16px 0}button,select{font:inherit;padding:11px 15px;border-radius:9px;border:1px solid #54708f;background:#263c57;color:white;cursor:pointer}button:hover{background:#365478}button:disabled{opacity:.5;cursor:default}.opt{display:block;width:100%;text-align:left;margin:10px 0}.chosen{background:#285d78;border-color:#6dc4f0}.good{border-color:#65d6a2}.bad{border-color:#ff8a8a}small,.muted{color:#aebfd1}.bar{height:9px;background:#304258;border-radius:9px;overflow:hidden}.bar div{height:100%;background:#62b7ef}#nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.notice{background:#263b53;border-radius:8px;padding:12px}.hidden{display:none}label{display:block;margin:14px 0}.answer{padding:12px;border-left:3px solid #70d5aa;background:#193c39;margin:14px 0}.warn{color:#ffc784}</style></head><body><h1>D320 Cloud Security — Autosave Quiz</h1><p class="muted">Original WGUEXAMS question bank · Resume progress · Shorter sessions</p><div id="app" class="panel">Loading questions…</div><script>
const SOURCE='https://raw.githubusercontent.com/WGUEXAMS/cloud-security/main/index.html';
const STORE='d320_standalone_v2';
let bank=[],session=null;
const app=document.getElementById('app');
const escapeHtml=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(STORE,JSON.stringify(session))}catch(e){alert('Browser storage unavailable. Keep this tab open, or enable site storage.')}}
function loadBank(source){let match=source.match(/(?:const|let)\s+questions\s*=\s*(\[[\s\S]*?\n\s*\]);/);if(!match)throw Error('Could not find the original question bank.');let parsed=Function('"use strict";return ('+match[1]+')')();if(!Array.isArray(parsed)||parsed.length<100||!parsed.every(q=>typeof q.q==='string'&&Array.isArray(q.opts)&&Number.isInteger(q.ans)))throw Error('Question bank format changed.');return parsed}
async function init(){try{let r=await fetch(SOURCE,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);bank=loadBank(await r.text());ready()}catch(e){app.innerHTML=`<h2>Could not load the question bank</h2><p>${escapeHtml(e.message)}</p><p>This standalone file needs internet access the first time you open it. If Chrome blocks the request, you can download the original site's HTML and load it below.</p><label>Choose the original index.html file <input id="sourcefile" type="file" accept=".html,.htm,text/html"></label><button onclick="init()">Try again</button>`;document.getElementById('sourcefile').onchange=async e=>{try{bank=loadBank(await e.target.files[0].text());ready()}catch(err){alert(err.message)}}}}
function ready(){try{session=JSON.parse(localStorage.getItem(STORE)||'null')}catch{session=null}if(session&&(!Array.isArray(session.ids)||session.ids.some(i=>i<0||i>=bank.length)))session=null;menu()}
function menu(){let saved=session&&!session.finished;app.innerHTML=`<h2>${bank.length} original questions loaded</h2>${saved?`<div class="notice"><strong>Saved session:</strong> ${session.answers.filter(x=>x!==null).length}/${session.ids.length} answered. <button id="resume">Resume</button></div>`:''}<label>Session length <select id="count"><option value="20">20 questions</option><option value="40" selected>40 questions</option><option value="117">117 questions</option></select></label><button id="start">Start new test</button> ${session&&session.finished?'<button id="review">Review last results</button>':''}<p class="muted">Answers save automatically in this browser after every selection. Refresh or close and reopen this same file to resume. Avoid Incognito mode.</p><p class="warn">Questions are downloaded from the original public GitHub repository; an internet connection is required each time this file opens.</p>`;if(saved)document.getElementById('resume').onclick=show;document.getElementById('start').onclick=()=>{if(saved&&!confirm('Replace your saved session?'))return;let n=Number(document.getElementById('count').value);let ids=bank.map((_,i)=>i);for(let i=ids.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}ids=ids.slice(0,Math.min(n,ids.length));session={ids,answers:ids.map(()=>null),flags:ids.map(()=>false),current:0,finished:false};persist();show()};if(session&&session.finished)document.getElementById('review').onclick=results}
function show(){if(!session)return menu();if(session.finished)return results();let i=session.current,q=bank[session.ids[i]],answered=session.answers.filter(x=>x!==null).length;app.innerHTML=`<div style="display:flex;justify-content:space-between;gap:12px"><strong>Question ${i+1} of ${session.ids.length}</strong><span>${answered} answered · Saved locally</span></div><div class="bar" style="margin:14px 0"><div style="width:${100*answered/session.ids.length}%"></div></div><h2 style="line-height:1.4">${escapeHtml(q.q)}</h2><div id="options">${q.opts.map((o,j)=>`<button class="opt ${session.answers[i]===j?'chosen':''}" data-choice="${j}">${'ABCD'[j]}. ${escapeHtml(o)}</button>`).join('')}</div><label><input type="checkbox" id="flag" ${session.flags[i]?'checked':''}> Flag for review</label><div id="nav"><button id="prev" ${i===0?'disabled':''}>← Previous</button><button id="next" ${i===session.ids.length-1?'disabled':''}>Next →</button><button id="finish">Submit & score</button><button id="menu">Menu</button></div><label>Jump to question <select id="jump">${session.ids.map((_,j)=>`<option value="${j}" ${j===i?'selected':''}>${j+1}${session.answers[j]!==null?' ✓':''}${session.flags[j]?' ⚑':''}</option>`).join('')}</select></label>`;document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{session.answers[i]=Number(el.dataset.choice);persist();show()});document.getElementById('flag').onchange=e=>{session.flags[i]=e.target.checked;persist()};document.getElementById('prev').onclick=()=>move(i-1);document.getElementById('next').onclick=()=>move(i+1);document.getElementById('jump').onchange=e=>move(Number(e.target.value));document.getElementById('menu').onclick=menu;document.getElementById('finish').onclick=()=>{let remaining=session.answers.filter(x=>x===null).length;if(remaining&&!confirm(`${remaining} unanswered. Submit anyway?`))return;session.finished=true;persist();results()}}
function move(i){session.current=i;persist();show()}
function results(){let correct=session.answers.filter((a,i)=>a===bank[session.ids[i]].ans).length;let missed=session.ids.map((id,i)=>({q:bank[id],a:session.answers[i],i})).filter(x=>x.a!==x.q.ans);app.innerHTML=`<h2>Score: ${correct}/${session.ids.length} (${Math.round(100*correct/session.ids.length)}%)</h2><p>${missed.length} missed or unanswered</p><button id="menu">Back to menu</button><button id="new">Start another session</button>${missed.map(({q,a,i})=>`<div class="panel"><strong>Question ${i+1}: ${escapeHtml(q.q)}</strong><p class="bad">Your answer: ${a===null?'Unanswered':escapeHtml(q.opts[a])}</p><p class="answer">Correct: ${escapeHtml(q.opts[q.ans])}</p>${q.rat?`<p>${escapeHtml(q.rat)}</p>`:''}</div>`).join('')}`;document.getElementById('menu').onclick=menu;document.getElementById('new').onclick=menu}
init();
</script></body></html>
